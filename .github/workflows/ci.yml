name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  relay:
    name: Relay Linux
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: relay/go.mod
          cache-dependency-path: relay/go.mod

      - name: Format check
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build -trimpath -o minetunnel-relay .

  windows-app:
    name: Aplicativo Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build
        shell: powershell
        run: .\app\build.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MineTunnel-Windows
          path: |
            app/dist/MineTunnel.exe
            app/dist/minetunnel.json
            app/dist/LEIA-ME.txt
          if-no-files-found: error
